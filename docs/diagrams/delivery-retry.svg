<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="1030" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionInbox - failure, retry and redelivery</text>
  <text class="subtitle" x="40" y="78">The same message id delivered three times: a failed attempt leaves nothing behind, one attempt commits, the rest are duplicates.</text>

  <!-- participants -->
  <rect class="ext" x="40" y="100" width="220" height="56" rx="12"/>
  <text class="label" x="150" y="125" text-anchor="middle">Broker</text>
  <text class="small" x="150" y="145" text-anchor="middle">at-least-once</text>
  <rect class="step" x="340" y="100" width="220" height="56" rx="12"/>
  <text class="label" x="450" y="125" text-anchor="middle">Your consumer</text>
  <text class="small" x="450" y="145" text-anchor="middle">one DI scope per delivery</text>
  <rect class="step" x="640" y="100" width="220" height="56" rx="12"/>
  <text class="label" x="750" y="125" text-anchor="middle">IOrionInbox</text>
  <text class="code" x="750" y="145" text-anchor="middle">EfCoreInbox&lt;TDbContext&gt;</text>
  <rect class="ext" x="940" y="100" width="220" height="56" rx="12"/>
  <text class="label" x="1050" y="125" text-anchor="middle">Database</text>
  <text class="small" x="1050" y="145" text-anchor="middle">dedup table + your tables</text>

  <!-- lifelines -->
  <line class="lane" x1="150" y1="156" x2="150" y2="925"/>
  <line class="lane" x1="450" y1="156" x2="450" y2="925"/>
  <line class="lane" x1="750" y1="156" x2="750" y2="925"/>
  <line class="lane" x1="1050" y1="156" x2="1050" y2="925"/>

  <!-- attempt 1: handler fails -->
  <text class="small" x="40" y="204">attempt 1</text>
  <circle class="badge" cx="150" cy="200" r="11"/>
  <text class="badge-text" x="150" y="204" text-anchor="middle">1</text>
  <path class="flow" d="M162,200 L448,200"/>
  <text class="edge" x="300" y="192" text-anchor="middle">deliver m-42</text>
  <path class="flow" d="M452,240 L748,240"/>
  <text class="code" x="600" y="232" text-anchor="middle">ProcessAsync(&quot;m-42&quot;, payload)</text>
  <path class="flow" d="M752,280 L1048,280"/>
  <text class="edge" x="900" y="272" text-anchor="middle">ExistsAsync: no; insert the dedup row</text>
  <rect class="fail" x="650" y="296" width="200" height="36" rx="10"/>
  <text class="small" x="750" y="319" text-anchor="middle">HandleAsync throws</text>
  <path class="flow alt" d="M752,360 L1048,360"/>
  <text class="edge" x="900" y="352" text-anchor="middle">transaction rolled back: nothing stored</text>
  <path class="flow alt" d="M748,400 L452,400"/>
  <text class="edge" x="600" y="392" text-anchor="middle">the exception propagates</text>
  <path class="flow alt" d="M448,440 L152,440"/>
  <text class="edge" x="300" y="432" text-anchor="middle">no ack: the broker redelivers</text>

  <!-- attempt 2: processed -->
  <text class="small" x="40" y="494">attempt 2</text>
  <circle class="badge" cx="150" cy="490" r="11"/>
  <text class="badge-text" x="150" y="494" text-anchor="middle">2</text>
  <path class="flow" d="M162,490 L448,490"/>
  <text class="edge" x="300" y="482" text-anchor="middle">redeliver m-42</text>
  <path class="flow" d="M452,530 L748,530"/>
  <text class="code" x="600" y="522" text-anchor="middle">ProcessAsync(&quot;m-42&quot;, payload)</text>
  <path class="flow" d="M752,570 L1048,570"/>
  <text class="edge" x="900" y="562" text-anchor="middle">ExistsAsync: no; insert the dedup row</text>
  <path class="flow" d="M752,610 L1048,610"/>
  <text class="edge" x="900" y="602" text-anchor="middle">run the handler, then CommitAsync</text>
  <path class="flow back" d="M748,650 L452,650"/>
  <text class="code" x="600" y="642" text-anchor="middle">InboxResult.Processed</text>
  <path class="flow back" d="M448,690 L152,690"/>
  <text class="edge" x="300" y="682" text-anchor="middle">ack</text>

  <!-- attempt 3: duplicate -->
  <text class="small" x="40" y="744">attempt 3</text>
  <circle class="badge" cx="150" cy="740" r="11"/>
  <text class="badge-text" x="150" y="744" text-anchor="middle">3</text>
  <path class="flow" d="M162,740 L448,740"/>
  <text class="edge" x="300" y="732" text-anchor="middle">redeliver m-42 (the ack was lost)</text>
  <path class="flow" d="M452,780 L748,780"/>
  <text class="code" x="600" y="772" text-anchor="middle">ProcessAsync(&quot;m-42&quot;, payload)</text>
  <path class="flow" d="M752,820 L1048,820"/>
  <text class="edge" x="900" y="812" text-anchor="middle">ExistsAsync: the row is there</text>
  <path class="flow back" d="M748,860 L452,860"/>
  <text class="code" x="600" y="852" text-anchor="middle">InboxResult.Duplicate</text>
  <text class="small" x="600" y="878" text-anchor="middle">handler skipped, no second effect</text>
  <path class="flow back" d="M448,900 L152,900"/>
  <text class="edge" x="300" y="892" text-anchor="middle">ack</text>

  <!-- retention note -->
  <rect class="note" x="40" y="940" width="1120" height="60" rx="10"/>
  <text class="small" x="60" y="964">Retention: InboxPruneHostedService deletes rows older than DedupWindow (default 7 days) every PruneInterval (default 1 hour).</text>
  <text class="small" x="60" y="986">A redelivery after the window is processed again, so set DedupWindow longer than the broker's redelivery horizon.</text>
</svg>
